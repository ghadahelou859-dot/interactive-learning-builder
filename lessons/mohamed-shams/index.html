<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محمد وشمس — رحلة الجهاز التنفسي</title><style>body{margin:0;font-family:Tahoma,Arial;background:#e9f5ff;color:#173253}main{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 25px #0001}.hero{position:relative}.hero img{display:block;width:100%}.pane{padding:20px}h1{font-size:24px}h2{font-size:20px}button{border:0;border-radius:15px;padding:13px 17px;background:#147bb6;color:white;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.45}.chips{display:flex;flex-wrap:wrap}.chips button{background:#edf6ff;color:#135184;border:1px solid #b3dbfa}.card{background:#f3faff;border:1px solid #b7ddf4;padding:17px;border-radius:16px;margin:12px 0;line-height:1.8}.small{color:#526a7d}.good{background:#e4f9eb}.bad{background:#fff0e8}input{padding:13px;border:1px solid #a7c8da;border-radius:12px;font-size:17px;max-width:90%}.bar{height:9px;background:#e5edf5;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#27a5a7}#clock{font-weight:bold;color:#ba3d3d}.opts button{display:block;width:100%;margin:8px 0;text-align:right}.hide{display:none}html,body{min-height:100%;overflow:auto}main{min-height:100dvh;overflow:visible;position:relative}.hero img{max-height:48dvh;object-fit:cover}.pane{padding:16px 20px 34px}.pane #start{display:block;width:100%;position:relative;z-index:20;background:#147bb6;color:white;min-height:54px}.scene{height:100dvh}.scene{position:relative;height:100dvh;width:100%;overflow:hidden;background:#dceefa}.scene>img{height:100%;width:100%;object-fit:fill;display:block}.tap{position:absolute;background:transparent!important;border:0!important;padding:0!important;margin:0!important;z-index:5;touch-action:manipulation}.tap:focus-visible{outline:3px solid #f9d05b}.explain{position:absolute;bottom:11%;left:6%;right:6%;z-index:8;background:#fffef4f5;border:2px solid #65b9da;border-radius:20px;padding:16px;box-shadow:0 12px 30px #1236;line-height:1.7;max-height:38%;overflow:auto}.explain h2{margin:0 0 5px}.explain p{margin:0 0 9px}.scene-next{position:absolute;bottom:2%;left:9%;right:9%;z-index:9;border-radius:24px;background:#1577a7;color:#fff;padding:12px}.scene-next:disabled{opacity:.6}.scene-label{position:absolute;top:2%;left:6%;right:6%;z-index:4;background:#ffffffd9;padding:9px;border-radius:12px;text-align:center;font-size:14px}.scene .hint{position:absolute;bottom:2%;right:5%;z-index:7;font-size:12px;color:#123;background:#ffffffbd;padding:7px;border-radius:8px} .map-scene{position:relative;height:100dvh;overflow:hidden}.map-scene>img{width:100%;height:100%;object-fit:fill;display:block}.map-controls{position:absolute;bottom:2%;left:4%;right:4%;z-index:5;background:#ffffffe8;border-radius:16px;padding:9px;box-shadow:0 3px 18px #0003}.map-controls summary{cursor:pointer;font-weight:bold;padding:8px}.map-controls button{font-size:13px;padding:8px 10px;margin:3px}.map-top{position:absolute;top:2%;right:5%;left:5%;z-index:4;background:#ffffffe0;border-radius:14px;padding:8px;text-align:center}.tap{background:transparent!important;color:transparent!important;box-shadow:none!important;outline:0!important;opacity:0!important}.tap:focus-visible{opacity:1!important;outline:3px solid #fff!important}.scene-label{pointer-events:none}.scene-next{bottom:2%;left:22%;right:22%;padding:10px;font-size:14px;min-height:40px}.explain{bottom:10%;max-height:32%}.map-scene .map-hotspot{position:absolute;z-index:6;background:transparent!important;border:0!important;box-shadow:none!important;color:transparent!important;opacity:0!important;margin:0!important;padding:0!important;touch-action:manipulation}.map-scene .map-hotspot:focus-visible{opacity:1!important;outline:3px solid #ffe167!important}.map-scene .map-mini{position:absolute;top:1%;left:2%;z-index:7;background:#ffffffbb;border-radius:13px;padding:6px 9px;font-size:12px}.map-scene .map-mini button{font-size:12px;padding:6px 9px;margin:0;background:#147bb6}.map-scene .map-status{position:absolute;top:1%;right:2%;z-index:7;background:#ffffffbd;border-radius:10px;padding:7px 10px;font-size:12px;max-width:52%}.nav-floating{position:absolute;z-index:30;top:7%;right:3%}.nav-floating button{background:#ffffffed;color:#15527b;border:1px solid #b5d9ee;border-radius:50px;padding:9px 12px;margin:0;font-size:13px}.scene-next{z-index:30!important;bottom:2%!important;left:12%!important;right:12%!important;background:#147bb6!important;color:#fff!important;opacity:1!important;visibility:visible!important}.scene .scene-next{position:fixed!important;bottom:calc(16px + env(safe-area-inset-bottom))!important;left:15%!important;right:5%!important;width:58%!important;z-index:9999!important;display:block!important;pointer-events:auto!important;background:#126d9d!important;color:white!important;opacity:1!important;border:2px solid white!important;min-height:52px!important}.scene .nav-floating{position:fixed!important;top:auto!important;bottom:calc(16px + env(safe-area-inset-bottom))!important;right:auto!important;left:3%!important;z-index:9999!important}.scene .nav-floating button{min-height:52px!important;background:#fff!important;color:#13547b!important;border:2px solid #1577a7!important}.quiz-scene{position:relative;height:100dvh;overflow:hidden}.quiz-scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.quiz-panel{position:absolute;z-index:3;top:12%;bottom:4%;left:4%;right:4%;overflow:auto;background:#ffffffeb;border-radius:18px;padding:14px;box-sizing:border-box}.quiz-panel .opts button{min-height:48px}.quiz-panel .card{margin:10px 0}.quiz-panel h2{font-size:18px}</style></head><body><main><div id="root"></div></main><script>
const imgs=["https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/31461c1d-3378-4e90-a4b9-82cc1c540215/image/portrait/3d55c31b-18d1-4df4-80ea-afc85fdcb280.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/e260728d-9656-4aab-bbce-a5e7d82f2c3a/image/portrait/45976895-3b72-486a-90d7-6bc84aa1fe81.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/82ee5b63-3c37-44a4-8590-6e0dfd34f07b/image/portrait/0ae61096-05fe-4854-aa64-0ccc020074dd.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/a684da92-cc5d-4e5b-9e7c-a4436a56bd73/image/portrait/5348cff1-b30c-44d3-90f7-2ccca9fe0415.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/801444a7-59fa-49ca-8a7e-40ea46130543/image/portrait/8fe6616a-84d0-4c6a-941b-7be04143de4e.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/eab43f39-5241-4074-9783-226822e3ebcb/image/portrait/6d728cb6-810d-413e-883f-ebc661ef58ac.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/893133fc-e8af-4150-bf24-40e53299a256/image/portrait/c85270c9-2d18-459c-97b8-f7bd0f6617b1.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/a4ffc16f-47cc-48a7-b80b-bb4c64145cec/image/portrait/d3cdbb07-3888-4b13-98e0-a881bee9a21f.png","https://jzswtwicvgppisasrkqe.supabase.co/storage/v1/object/public/educational-media/949e0e59-1aaa-40df-8c7d-4e071042d818/image/portrait/68585432-2edd-4678-bf34-001497c6e89e.png"];const lessons=[["الأنف",[["التجويف الأنفي","يساعد على تدفئة الهواء وترطيبه."],["المخاط","يحتجز الغبار وبعض الجسيمات."],["شعيرات الأنف","تمنع دخول بعض الجسيمات الكبيرة."],["البلعوم","يمر عبره الهواء نحو الحنجرة."]],[["هل تساعد شعيرات الأنف على حجز الغبار؟",["صح","خطأ"],0],["أين يُدفّأ الهواء ويُرطّب؟",["الأنف","المعدة","القلب"],0],["رتّب مسار الهواء",["الأنف","البلعوم","الحنجرة","القصبة الهوائية"],0,"order"]]],["الممرات التنفسية",[["البلعوم","ممر مشترك للهواء والطعام."],["الحنجرة","تحتوي على الأحبال الصوتية."],["القصبة الهوائية","تنقل الهواء باتجاه الشعب الهوائية."],["الشعب الهوائية","تتفرع داخل الرئتين."]],[["هل توجد الأحبال الصوتية في الحنجرة؟",["صح","خطأ"],0],["إلى ماذا تتفرع القصبة الهوائية؟",["الشعب الهوائية","المعدة","الأذن"],0],["رتّب مسار الهواء",["البلعوم","الحنجرة","القصبة الهوائية","الشعب الهوائية"],0,"order"]]],["الرئتان والحويصلات",[["الرئتان","تحتويان على الممرات الهوائية والحويصلات."],["الحويصلات الهوائية","يحدث عندها تبادل الأكسجين وثاني أكسيد الكربون مع الدم."],["الحجاب الحاجز","عضلة تساعد على الشهيق والزفير."]],[["هل يحدث تبادل الغازات في الحويصلات الهوائية؟",["صح","خطأ"],0],["أي عضلة تساعد على التنفس؟",["الحجاب الحاجز","عضلة اليد","اللسان"],0],["رتّب من الأكبر إلى الأصغر",["الرئة","الشعب الهوائية","القصيبات","الحويصلات الهوائية"],0,"order"]]],["تنفس الحيوانات",[["الأسماك","تستخلص الأكسجين المذاب في الماء بالخياشيم."],["الطيور","تتنفس بالرئتين وتساعدها الأكياس الهوائية."],["الضفدع","يتنفس بالرئتين والجلد عندما يكون بالغًا."],["الدلفين","ثديي يتنفس الهواء بالرئتين."],["دودة الأرض","تتبادل الغازات عبر جلدها الرطب."]],[["هل الدلفين يتنفس بالخياشيم؟",["خطأ","صح"],0],["بماذا تتنفس الأسماك؟",["الخياشيم","الرئتان","الريش"],0],["اختر تسلسلًا صحيحًا",["الدلفين","الرئتان"],0,"pair"]]],["الهواء النظيف والتلوث",[["هواء نظيف","يساعد على حماية صحة الجهاز التنفسي."],["دخان المركبات","من مصادر تلوث الهواء."],["الغبار والدخان","قد يهيجان الجهاز التنفسي."],["حماية الهواء","نبتعد عن التدخين ونقلل حرق النفايات ونزرع الأشجار."]],[["هل دخان المركبات يلوث الهواء؟",["صح","خطأ"],0],["ما السلوك الذي يحمي الهواء؟",["عدم حرق النفايات","حرق البلاستيك","التدخين"],0],["رتّب سلوكيات مفيدة",["الابتعاد عن الدخان","تقليل حرق النفايات","زراعة الأشجار"],0,"order"]]]];const root=document.getElementById('root');let student=localStorage.getItem('ms_student')||'',station=0,stars=Number(localStorage.getItem('ms_stars')||0),unlocked=Number(localStorage.getItem('ms_unlocked')||0),quiz=[],qi=0,timer=null,remaining=10,correct=0,order=[];
function el(s){root.innerHTML=s}function save(){localStorage.setItem('ms_stars',stars);localStorage.setItem('ms_unlocked',unlocked)}function img(i){return '<div class="hero"><img src="'+imgs[i]+'" alt="صورة تعليمية"></div>'}function welcome(){clearInterval(timer);el(img(0)+'<div class="pane"><h1>رحلة محمد وشمس داخل الجهاز التنفسي</h1><p>تعرّف على أعضاء التنفس واكتسب النجوم!</p><label>اسم الطالب أو الطالبة</label><p><input id="name" value="'+student.replaceAll('"','&quot;')+'" placeholder="اكتب اسمك"></p><button id="start">ابدأ الرحلة</button></div>');document.getElementById('start').onclick=()=>{student=document.getElementById('name').value.trim();if(!student)return alert('اكتب اسمك أولًا');localStorage.setItem('ms_student',student);map()}}function map(){clearInterval(timer);el('<div class="map-scene" id="mapScene"><img src="'+imgs[1]+'" alt="خريطة رحلة الجهاز التنفسي"><div class="map-status">⭐ '+stars+' | '+student+'</div><div class="map-mini"><button id="switch" type="button">تغيير الطالب</button></div></div>');const scene=document.getElementById('mapScene');const spots=[[77,20],[52,38],[80,47],[24,56],[76,68],[42,80]];spots.forEach(([x,y],i)=>{const b=document.createElement('button');b.className='map-hotspot';b.type='button';b.style.cssText='left:'+(x-9)+'%;top:'+(y-5)+'%;width:18%;height:10%';b.setAttribute('aria-label',i===5?'التحدي الذهبي':'المحطة '+(i+1)+' '+lessons[i][0]);b.onclick=()=>{if(i>unlocked){alert('أكمل المحطة السابقة لفتح هذه المحطة');return}if(i===5)golden();else lesson(i)};scene.append(b)});document.getElementById('switch').onclick=()=>{if(!confirm('تغيير الطالب؟ سيتم تصفير التقدم المحفوظ على هذا الجهاز.'))return;localStorage.removeItem('ms_student');localStorage.removeItem('ms_stars');localStorage.removeItem('ms_unlocked');student='';stars=0;unlocked=0;welcome()}}
function lesson(i){station=i;clearInterval(timer);let l=lessons[i],seen=new Set();el('<div class="scene" id="scene"><img src="'+imgs[i+2]+'" alt="صورة محطة '+l[0]+'"><div class="scene-label">المحطة '+(i+1)+' — '+l[0]+' | اضغط على الأرقام أو الأجزاء داخل الصورة</div><div class="nav-floating"><button id="toMap" type="button">⌂ الخريطة</button></div><div id="hotspots"></div><div id="explain" class="explain hide" role="status" aria-live="polite"></div><button class="scene-next" id="next">التالي ← صفحة الأسئلة (0 / '+l[1].length+')</button></div>');document.getElementById('toMap').onclick=map;const host=document.getElementById('hotspots'),card=document.getElementById('explain'),next=document.getElementById('next');const zones=l[1].length;const spots=i===0?[[61,21],[88,32],[64,42],[93,54]]:zones===3?[[24,33],[67,37],[48,67]]:zones===4?[[24,30],[67,30],[24,59],[67,59]]:[[20,29],[50,29],[79,29],[30,61],[70,61]];l[1].forEach(([name,info],j)=>{const [x,y]=spots[j];const b=document.createElement('button');b.className='tap';b.style.cssText='left:'+(x-6)+'%;top:'+(y-4)+'%;width:12%;height:8%';b.setAttribute('aria-label','شرح '+name);b.title=name;b.onclick=()=>{seen.add(j);card.classList.remove('hide');card.innerHTML='<h2>'+name+'</h2><p>'+info+'</p><button id="dismiss">فهمت ✓</button>';document.getElementById('dismiss').onclick=()=>card.classList.add('hide');next.disabled=false;next.textContent='التالي ← صفحة الأسئلة ('+seen.size+' / '+zones+')'};host.append(b)});next.onclick=()=>startQuiz(i)}
function startQuiz(i){station=i;quiz=[...lessons[i][2]].sort(()=>Math.random()-.5);qi=0;correct=0;showQuestion()}function showQuestion(){clearInterval(timer);if(qi>=quiz.length)return finish();let q=quiz[qi];remaining=10;let type=q[3];el('<div class="quiz-scene"><img src="'+imgs[7]+'" alt="خلفية الأسئلة"><div class="quiz-panel"><button type="button" id="backToMap">⌂ الخريطة</button><h2>اختبار '+lessons[station][0]+'</h2><p>السؤال '+(qi+1)+' من '+quiz.length+' | <span id="clock">10</span> ثوانٍ</p><div class="bar"><div style="width:'+(qi/quiz.length*100)+'%"></div></div><div class="card"><h2>'+q[0]+'</h2><div class="opts" id="opts"></div></div><div id="feedback"></div></div></div>');document.getElementById('backToMap').onclick=map;let opts=document.getElementById('opts');if(type==='order'){order=[];document.getElementById('feedback').textContent='اضغط العناصر بالترتيب الصحيح.';q[1].slice().sort(()=>Math.random()-.5).forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{order.push(t);b.disabled=true;b.textContent='✓ '+t;if(order.length===q[1].length)answer(order.every((v,i)=>v===q[1][i]),q[1].join(' ← '))};opts.append(b)})}else{q[1].forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(i===q[2],q[1][q[2]]);opts.append(b)})}timer=setInterval(()=>{remaining--;let clock=document.getElementById('clock');if(clock)clock.textContent=remaining;if(remaining<=0)answer(false,type==='order'?q[1].join(' ← '):q[1][q[2]],true)},1000)}
function answer(ok,right,timeout=false){clearInterval(timer);document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);if(ok){correct++;stars++;save()}let f=document.getElementById('feedback');f.className='card '+(ok?'good':'bad');f.textContent=(ok?'أحسنت! ⭐':timeout?'انتهى الوقت!':'حاول مرة أخرى لاحقًا.')+' الإجابة الصحيحة: '+right;let b=document.createElement('button');b.textContent=qi===quiz.length-1?'النتيجة':'السؤال التالي';b.onclick=()=>{qi++;showQuestion()};f.append(b)}function finish(){if(correct>0&&station===unlocked){unlocked=Math.min(5,unlocked+1);save()}el(img(8)+'<div class="pane"><h1>نتيجة '+student+'</h1><h2>'+correct+' / '+quiz.length+' إجابات صحيحة</h2><p>مجموع النجوم: ⭐ '+stars+'</p><button id="again">إعادة الاختبار</button><button id="map">خريطة الرحلة</button></div>');document.getElementById('again').onclick=()=>startQuiz(station);document.getElementById('map').onclick=map}function golden(){el(img(7)+'<div class="pane"><h1>🏆 التحدي الذهبي</h1><p>أتممت المحطات الخمس! التحدي النهائي قيد استكمال بنك الأسئلة.</p><button id="map">خريطة الرحلة</button></div>');document.getElementById('map').onclick=map}welcome();
</script></body></html>
