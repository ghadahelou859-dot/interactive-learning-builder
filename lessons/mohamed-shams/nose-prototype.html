<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محمد وشمس | محطة الأنف</title><style>body{font-family:system-ui;background:#eaf6fa;color:#17364a;margin:0}main{max-width:700px;margin:auto;padding:20px}.box{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #0001}button{border:0;border-radius:12px;background:#158c9b;color:white;padding:12px;margin:5px;font-size:16px}button:disabled{opacity:.5}h1{font-size:28px}.info{background:#e9f7ff;padding:14px;border-radius:12px}</style><main><h1>🌬️ محمد وشمس: رحلة داخل الأنف</h1><p>محطة تجريبية للصف الرابع</p><div class="box"><h2>اكتشف وظائف الأنف</h2><p>اضغط على النقاط الثلاث:</p><button data-info="يدخل الهواء إلى الجسم من فتحتي الأنف.">فتحتا الأنف</button><button data-info="تساعد الشعيرات والمخاط على التقاط الغبار وبعض الجسيمات.">تنقية الهواء</button><button data-info="يساعد الأنف على تدفئة الهواء وترطيبه قبل وصوله للرئتين.">تدفئة وترطيب الهواء</button><p id="info" class="info" aria-live="polite">اختر نقطة لتعرف وظيفتها.</p></div><div class="box"><h2>⭐ تحدّي النجوم</h2><p id="stars">0 من 3 نجوم</p><div id="quiz"></div><p id="end" aria-live="polite"></p></div><p>هذه نسخة تجريبية؛ ربط الصور والخريطة وباقي المحطات لم يكتمل بعد.</p></main><script>const questions=[{q:"هل يساعد الأنف على تنقية الهواء من الغبار؟",a:["نعم","لا"],correct:0},{q:"ما الذي يفعله الأنف للهواء؟",a:["يدفئه ويرطبه","يهضم الطعام","يضخ الدم"],correct:0},{q:"ما المسار الصحيح للهواء؟",a:["الأنف ثم الممرات التنفسية ثم الرئتان","الرئتان ثم المعدة","المعدة ثم القلب"],correct:0}];let stars=0,done=0;document.querySelectorAll("[data-info]").forEach(b=>b.onclick=()=>document.querySelector("#info").textContent=b.dataset.info);questions.forEach((q,i)=>{const el=document.createElement("section"),title=document.createElement("h3"),result=document.createElement("p");title.textContent=(i+1)+". "+q.q;el.append(title);q.a.forEach((answer,j)=>{const b=document.createElement("button");b.textContent=answer;b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.disabled=true);done++;if(j===q.correct){stars++;result.textContent="إجابة صحيحة! حصلت على نجمة ⭐"}else result.textContent="الإجابة الصحيحة: "+q.a[q.correct];document.querySelector("#stars").textContent=stars+" من 3 نجوم";if(done===questions.length)document.querySelector("#end").textContent="أحسنت! أكملت تحدّي محطة الأنف.";};el.append(b)});el.append(result);document.querySelector("#quiz").append(el)});</script></html>
