<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محمد وشمس — معاينة تطوير</title><style>*{box-sizing:border-box}body{margin:0;background:#e8f3fb;font:17px system-ui;color:#153753}main{max-width:550px;min-height:100vh;margin:auto;background:white;padding:24px}h1{text-align:center}button,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #adc6d8}button{background:#1369a9;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}input{width:100%;margin:8px 0}.card{background:#f1f8ff;border-radius:18px;padding:17px;margin:15px 0}.hide{display:none}.choices button{display:block;width:100%;text-align:right}.muted{color:#627b8e}.clock{font-size:28px;color:#ad481b}.stop{width:100%;text-align:right}a{color:#1369a9}</style><main><h1>🌟 رحلة محمد وشمس</h1><p class="muted">معاينة تطوير مستقلة — لا تؤثر على مشاريع لوحة غادة</p><section id="login" class="card"><h2>أهلًا يا بطل!</h2><label>اسم الطالب الكامل<input id="name" autocomplete="name"></label><label>الشعبة<input id="klass"></label><button id="start">ابدأ الرحلة</button></section><section id="map" class="hide"><h2 id="hello"></h2><p>استكشف محطات الجهاز التنفسي بالترتيب.</p><div id="stops"></div><button id="switch">طالب آخر</button><p><a href="../index.html">العودة إلى لوحة غادة</a></p></section><section id="lesson" class="hide"><h2 id="lessonTitle"></h2><div class="card" id="lessonText"></div><p class="muted">فيديو المحطة سيُضاف بعد اعتماد المادة المصورة.</p><button id="test">ابدأ تحدي المحطة</button><button id="back">الخريطة</button></section><section id="quiz" class="hide"><p id="counter"></p><strong class="clock" id="clock">10</strong><div class="card"><h2 id="question"></h2><div id="choices" class="choices"></div><p id="feedback"></p></div><button id="next" disabled>التالي</button></section><section id="result" class="hide"><h2 id="resultText"></h2><button id="return">العودة للخريطة</button><button id="again">إعادة المحاولة</button></section></main><script>
const titles=['الأنف','الممرات التنفسية','الرئتان','كيف تتنفس الحيوانات؟','الهواء النظيف والتلوث','التحدي الذهبي'],descriptions=['يساعد الأنف على تنقية الهواء وترطيبه وتدفئته. تحجز الشعيرات والمخاط بعض الغبار والشوائب.','يمر الهواء عبر البلعوم والحنجرة والقصبة الهوائية، ثم تتفرع القصبة إلى شعبتين تتجهان إلى الرئتين.','تحتوي الرئتان على حويصلات هوائية صغيرة يتم عندها تبادل الأكسجين وثاني أكسيد الكربون. ويساعد الحجاب الحاجز في التنفس.','تتنفس الأسماك بالخياشيم، بينما يتنفس الضفدع البالغ بالرئتين والجلد.','يساعد الابتعاد عن التدخين والهواء الملوث وتهوية الأماكن على حماية الجهاز التنفسي.','حان وقت مراجعة ما تعلمناه!'];
const bank=[
[0,'tf','تساعد شعيرات الأنف على حجز بعض الغبار.',['صح','خطأ'],'صح'],[0,'mcq','ما العضو الذي ينقّي الهواء عند دخوله من الأنف؟',['الأنف','المعدة','القلب'],'الأنف'],[0,'image','أي وصف يناسب وظيفة الأنف؟',['ترطيب الهواء','هضم الطعام','ضخ الدم'],'ترطيب الهواء'],
[1,'tf','تتفرع القصبة الهوائية إلى شعبتين رئيسيتين.',['صح','خطأ'],'صح'],[1,'mcq','أي عضو يمر به الهواء بعد الحنجرة؟',['القصبة الهوائية','المريء','المعدة'],'القصبة الهوائية'],[1,'image','أي وصف يطابق القصبة الهوائية؟',['أنبوب يمر فيه الهواء','عضلة تضخ الدم','عظم يحمي الدماغ'],'أنبوب يمر فيه الهواء'],
[2,'tf','تحدث عملية تبادل الغازات في الحويصلات الهوائية.',['صح','خطأ'],'صح'],[2,'mcq','ما العضلة التي تساعد الرئتين على الشهيق والزفير؟',['الحجاب الحاجز','اللسان','عضلة الذراع'],'الحجاب الحاجز'],[2,'image','أي وصف يطابق الحويصلات الهوائية؟',['أكياس هوائية صغيرة','أسنان صغيرة','أوعية هضمية'],'أكياس هوائية صغيرة'],
[3,'tf','تتنفس الأسماك عادة بواسطة الخياشيم.',['صح','خطأ'],'صح'],[3,'mcq','كيف يتنفس الضفدع البالغ؟',['بالرئتين والجلد','بالخياشيم فقط','بالأنف فقط'],'بالرئتين والجلد'],[3,'image','أي وصف يطابق عضو تنفس السمكة؟',['الخياشيم','الأجنحة','الأقدام'],'الخياشيم'],
[4,'tf','التدخين يضر الجهاز التنفسي.',['صح','خطأ'],'صح'],[4,'mcq','أي سلوك يحافظ على صحة الجهاز التنفسي؟',['تجنب الدخان','استنشاق الدخان','حرق النفايات قرب المنزل'],'تجنب الدخان'],[4,'image','أي مشهد يدل على هواء أنظف؟',['مكان جيد التهوية بعيد عن الدخان','غرفة مليئة بالدخان','حرق البلاستيك'],'مكان جيد التهوية']];
const $=id=>document.getElementById(id);let student=null,station=0,selected=[],idx=0,score=0,answered=false,seconds=10,timer=null;
function show(id){clearInterval(timer);['login','map','lesson','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function save(){localStorage.setItem('ms_preview_student',JSON.stringify(student))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function draw(){ $('hello').textContent='أهلًا '+student.name+' 🌟';$('stops').innerHTML='';titles.forEach((t,i)=>{const b=document.createElement('button');b.className='stop';b.disabled=i>student.unlocked;b.textContent=(i<student.unlocked?'⭐ ':i===student.unlocked?'🔓 ':'🔒 ')+(i+1)+'. '+t;b.onclick=()=>{station=i;$('lessonTitle').textContent=t;$('lessonText').textContent=descriptions[i];show('lesson')};$('stops').appendChild(b)});show('map')}
function quiz(){const pool=station===5?bank:bank.filter(q=>q[0]===station);selected=station===5?shuffle([0,1,2,3,4]).map(n=>shuffle(pool.filter(q=>q[0]===n))[0]):shuffle(pool);idx=0;score=0;question()}
function question(){clearInterval(timer);answered=false;seconds=10;$('clock').textContent='⏱ '+seconds;$('counter').textContent='السؤال '+(idx+1)+' من '+selected.length;const q=selected[idx];$('question').textContent=q[2];$('feedback').textContent=q[1]==='image'?'تنبيه: الصور التعليمية قيد التجهيز؛ هذه خيارات نصية مؤقتة.':'';$('next').disabled=true;$('choices').innerHTML='';shuffle(q[3]).forEach(opt=>{const b=document.createElement('button');b.textContent=opt;b.onclick=()=>answer(opt);$('choices').appendChild(b)});show('quiz');timer=setInterval(()=>{seconds--;$('clock').textContent='⏱ '+seconds;if(seconds<=0)answer(null)},1000)}
function answer(v){if(answered)return;answered=true;clearInterval(timer);const right=selected[idx][4];if(v===right)score++;$('feedback').textContent=v===right?'إجابة صحيحة! ⭐':'الإجابة الصحيحة: '+right;[...$('choices').children].forEach(b=>b.disabled=true);$('next').disabled=false}
function finish(){const old=student.attempts[station]||[];old.push({score,total:selected.length,date:new Date().toISOString()});student.attempts[station]=old;if(station===student.unlocked&&score>=Math.ceil(selected.length*.6))student.unlocked=Math.min(5,station+1);save();$('resultText').textContent='نتيجتك '+score+' من '+selected.length+' ⭐';show('result')}
$('start').onclick=()=>{const name=$('name').value.trim(),klass=$('klass').value.trim();if(name.length<3||!klass)return alert('اكتب الاسم الكامل والشعبة');student={name,klass,unlocked:0,attempts:{}};save();draw()};$('switch').onclick=()=>{localStorage.removeItem('ms_preview_student');student=null;show('login')};$('test').onclick=quiz;$('back').onclick=draw;$('next').onclick=()=>{if(++idx<selected.length)question();else finish()};$('return').onclick=draw;$('again').onclick=quiz;
try{const saved=JSON.parse(localStorage.getItem('ms_preview_student')||'null');if(saved&&saved.name){student=saved;draw()}}catch(e){}
</script></html>
