<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة رحلة محمد وشمس</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#164d91,#071a38 75%);color:#fff;font-family:system-ui,'Segoe UI',sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{text-align:center;font-size:clamp(24px,5vw,42px)}p{text-align:center;color:#c9e9ff}.scene{position:relative;background:linear-gradient(150deg,#2361a565,#0a245b);border:2px solid #79d5ff88;border-radius:28px;padding:15px;box-shadow:0 20px 55px #0005}.scene svg{display:block;width:100%;height:auto;max-height:580px}.organ{cursor:pointer;transition:filter .3s,stroke .3s;outline:none}.organ:focus{stroke:#fff;stroke-width:7}.organ.active{filter:drop-shadow(0 0 12px #42d8ff)}.organ.done{filter:drop-shadow(0 0 13px #ffd34f);stroke:#ffd34f!important;stroke-width:5}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}@media(max-width:550px){.labels{grid-template-columns:repeat(2,1fr)}}button,a{font:inherit;border:1px solid #ffffff90;border-radius:16px;padding:12px;color:#fff;background:#ffffff20;cursor:pointer;text-decoration:none;text-align:center;backdrop-filter:blur(12px)}button.selected{background:#158fc3}button.completed{border-color:#ffd34f;color:#ffe69c}.detail{background:#ffffff19;border:1px solid #ffffff44;border-radius:22px;padding:20px;margin-top:14px}.detail h2{margin-top:0}.star{color:#ffd34f;font-size:24px}#go{display:inline-block;background:#0b98b3;font-weight:700;margin-top:10px}.hint{font-size:13px;color:#d1e5f4}</style></head><body><main><h1>✨ رحلة داخل الجهاز التنفسي</h1><p>اضغط على اسم العضو أو عليه داخل الجسم لاكتشافه، وشاهد إضاءته الذهبية بعد إتمام التحدّي.</p><section class="scene"><svg viewBox="0 0 500 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رسم تخطيطي تفاعلي للجهاز التنفسي"><defs><linearGradient id="skin" x2="1" y2="1"><stop stop-color="#90e7ff" stop-opacity=".55"/><stop offset="1" stop-color="#2469b8" stop-opacity=".13"/></linearGradient><linearGradient id="lung" x2="1" y2="1"><stop stop-color="#ffa4b7"/><stop offset="1" stop-color="#d94d79"/></linearGradient></defs><path d="M218 35 Q250 5 282 35 Q308 65 289 112 L291 145 Q367 154 408 208 L455 325 L411 351 L380 278 L365 566 L135 566 L120 278 L89 351 L45 325 L92 208 Q133 154 209 145 L211 112 Q192 65 218 35Z" fill="url(#skin)" stroke="#80dcff" stroke-width="4"/><g class="organ" data-index="0" tabindex="0" role="button" aria-label="الأنف"><path d="M245 54 Q232 79 218 94 Q247 109 280 94 Q264 82 257 55Z" fill="#ffc2aa" stroke="#ff8b9b" stroke-width="3"/></g><g class="organ" data-index="1" tabindex="0" role="button" aria-label="البلعوم والحنجرة"><path d="M250 105 L250 170" fill="none" stroke="#ffab9e" stroke-width="21" stroke-linecap="round"/></g><g class="organ" data-index="2" tabindex="0" role="button" aria-label="القصبة الهوائية"><path d="M250 168 L250 292" fill="none" stroke="#ffc3b6" stroke-width="26" stroke-linecap="round"/><path d="M238 183 H262 M238 202 H262 M238 221 H262 M238 240 H262 M238 259 H262" stroke="#be6e89" stroke-width="5"/></g><g class="organ" data-index="3" tabindex="0" role="button" aria-label="الرئتان"><path d="M231 204 Q183 179 150 228 Q117 286 141 386 Q161 425 221 400 Q236 357 231 204Z" fill="url(#lung)" stroke="#ffc0d3" stroke-width="4"/><path d="M269 204 Q317 179 350 228 Q383 286 359 386 Q339 425 279 400 Q264 357 269 204Z" fill="url(#lung)" stroke="#ffc0d3" stroke-width="4"/><path d="M250 289 L193 316 L167 357 M250 289 L307 316 L335 357" stroke="#ffe3df" stroke-width="8" fill="none"/></g><g class="organ" data-index="4" tabindex="0" role="button" aria-label="الحويصلات الهوائية"><circle cx="322" cy="343" r="24" fill="#ffadc7" stroke="#ffe6f0" stroke-width="4"/><circle cx="301" cy="359" r="18" fill="#ffadc7"/><circle cx="339" cy="363" r="18" fill="#ffadc7"/><circle cx="318" cy="381" r="16" fill="#ffadc7"/></g><g class="organ" data-index="5" tabindex="0" role="button" aria-label="الحجاب الحاجز"><path d="M136 439 Q250 368 364 439" fill="none" stroke="#ffae7e" stroke-width="24" stroke-linecap="round"/></g><path d="M250 116 L250 380" stroke="#61e1ff" stroke-width="4" stroke-dasharray="12 12" opacity=".8"/></svg><div class="labels" id="labels"></div></section><section class="detail" aria-live="polite"><h2 id="name"></h2><p id="desc" style="text-align:right"></p><div id="status"></div><a id="go" href="nose-station.html">استكشف العضو ←</a></section><p class="hint">الإنجاز يُحفظ على هذا المتصفح فقط في النسخة الحالية؛ بقية المحطات لم تُنشأ بعد.</p></main><script>const organs=[['الأنف','ينقّي الهواء من بعض الشوائب، ويساعد على تدفئته وترطيبه.'],['البلعوم والحنجرة','يمر الهواء عبرهما في طريقه إلى القصبة الهوائية.'],['القصبة الهوائية','تنقل الهواء إلى الشعب الهوائية المتجهة إلى الرئتين.'],['الرئتان','تحتويان على الحويصلات الهوائية التي يحدث فيها تبادل الغازات.'],['الحويصلات الهوائية','ينتقل الأكسجين منها إلى الدم، وثاني أكسيد الكربون من الدم إليها.'],['الحجاب الحاجز','عضلة تساعد على دخول الهواء وخروجه بتحركها إلى الأسفل والأعلى.']];const key='mohammad-shams-nose-best';let selected=0;let best=0;try{best=Number(localStorage.getItem(key)||0)}catch(e){}function draw(){document.querySelectorAll('.organ').forEach(el=>{const i=Number(el.dataset.index);el.classList.toggle('active',i===selected);el.classList.toggle('done',i===0&&best>0)});document.querySelectorAll('#labels button').forEach((b,i)=>{b.classList.toggle('selected',i===selected);b.classList.toggle('completed',i===0&&best>0)});document.getElementById('name').textContent=organs[selected][0];document.getElementById('desc').textContent=organs[selected][1];document.getElementById('status').innerHTML=selected===0?(best>0?'<span class="star">'+ '★'.repeat(best)+'☆'.repeat(3-best)+'</span> — تم إنجاز المحطة':'🔵 جاهز للاستكشاف'):'🔵 المحطة قيد التجهيز';document.getElementById('go').style.display=selected===0?'inline-block':'none'}const labels=document.getElementById('labels');organs.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{selected=i;draw()};labels.appendChild(b)});document.querySelectorAll('.organ').forEach(el=>{el.onclick=()=>{selected=Number(el.dataset.index);draw()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});draw();</script></body></html>
