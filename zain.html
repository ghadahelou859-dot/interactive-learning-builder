 tick();timer=setInterval(tick,250);const back=button('إنهاء المحاولة والعودة للخريطة',()=>{if(confirm('العودة للخريطة؟ ستبدئين تحدّيًا جديدًا عند المحاولة التالية.')){attempt=null;go(2)}},'secondary');back.style.marginTop='18px';card.append(back)
}

 const card=flow();card.classList.add('result');const high=result.score>=8;card.append(el('h1','','نتيجة التحدّي'));const ring=el('div','result-ring');ring.append(el('b','',String(result.score)),el('span','','من '+result.total));card.append(ring,el('h2','',high?'أحسنت!':'واصلي الاكتشاف!'),el('p','',high?'اقتربتِ من الإتقان.':'راجعي الأفكار ثم جرّبي مرة أخرى.'),el('p','','تم حفظ نتيجتك لدى المعلمة.'));const actions=el('div','actions');actions.style.justifyContent='center';actions.append(button('العودة للخريطة',()=>go(2)),button('إعادة المحاولة',()=>{attempt=null;result=null;go(19)},'secondary'));card.append(actions);
 const wrong=result.answers.filter(a=>!a.correct);if(wrong.length){const d=el('details'),s=el('summary','','راجعي إجاباتك ('+wrong.length+')');d.append(s);wrong.forEach(a=>{const r=el('div','review');r.append(el('strong','',a.question),el('p','','الإجابة الصحيحة: '+a.expected),el('p','',a.explanation));d.append(r)});card.append(d)}
 const contact=el('section');contact.append(el('h2','social-heading','تواصل معنا لو حبيت الفكرة'));const links=el('div','social-links');

 const msg='مرحبًا، حبيت فكرة درس زين التفاعلي وبدي أستفسر عن عمل مشروع مشابه.';const whats=tile('واتساب','whatsapp','<path d="M20 11.7a8 8 0 0 1-11.7 7.1L4 20l1.2-4.3A8 8 0 1 1 20 11.7Z"/><path d="M9 8.5c-.6 1.8 2.1 5.5 4.9 6.2.8.2 1.5-.7 1.8-1.4l-2-1.1-.8 1c-1.3-.6-2.2-1.5-2.8-2.7l1-1-.9-1.9Z"/>',CONTACT_WHATSAPP?'https://wa.me/'+CONTACT_WHATSAPP+'?text='+encodeURIComponent(msg):'');if(!CONTACT_WHATSAPP){whats.setAttribute('aria-disabled','true');whats.title='ننتظر رقم واتساب غادة لربط الزر';whats.onclick=e=>{e.preventDefault();let note=contact.querySelector('.contact-note');if(!note){note=el('p','feedback contact-note','رابط واتساب المباشر يحتاج رقم التواصل الخاص بغادة.');contact.append(note)}}}links.append(whats);

function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=el('div','confetti');for(let i=0;i<45;i++){const dot=el('i');dot.style.left=Math.random()*100+'%';dot.style.background=['#ffce45','#0a9feb','#fe7652','#44cfa2'][i%4];dot.style.animationDelay=Math.random()*.4+'s';layer.append(dot)}document.body.append(layer);setTimeout(()=>layer.remove(),3500)}
async function teacher(){
 const card=flow();card.append(el('h1','','لوحة نتائج المعلمة'));const form=el('form'),label=el('label','','كلمة مرور لوحة غادة'),pw=el('input');pw.type='password';pw.autocomplete='current-password';pw.required=true;const err=el('p','status'),send=el('button','primary','عرض النتائج');send.type='submit';form.append(label,pw,err,send);card.append(form);form.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{const d=await api({action:'teacher',password:pw.value});pw.value='';renderTeacher(d.rows)}catch(e){err.textContent=e.message;send.disabled=false}}

function renderTeacher(rows){clear();const section=el('section','teacher');section.append(el('h1','','نتائج زين وعالم الذرّة'),el('p','','البريد الإلكتروني مُدخل من الطالب، ولم يتم التحقّق منه برمز.'));section.append(button('تنزيل النتائج Excel / CSV',()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^[=+\-@]/,"'"+String(v)[0])+'"';const data=[['الاسم','الإيميل','النتيجة','العلامة الكاملة','الحالة','الوقت بالثواني','تاريخ البدء'],...rows.map(r=>[r.name,r.email,r.score,r.total,r.completed_at?'مكتمل':'بدأ ولم يكمل',r.duration,r.started_at])].map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.download='zain-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'primary'));const wrap=el('div','table-wrap'),t=el('table'),thead=el('thead'),tr=el('tr');['الطالب','الإيميل','النتيجة','الحالة','الوقت','التاريخ'].forEach(x=>tr.append(el('th','',x)));thead.append(tr);t.append(thead);const body=el('tbody');rows.forEach(r=>{const row=el('tr');[r.name,r.email,r.score+' / '+r.total,r.completed_at?'مكتمل':'بدأ ولم يكمل',r.duration===null?'—':r.duration+' ث',new Date(r.started_at).toLocaleString('ar-PS')].forEach(x=>row.append(el('td','',x)));body.append(row)});t.append(body);wrap.append(t);section.append(el('p','','المحاولات: '+rows.length),wrap,button('فتح الدرس',()=>{location.hash='';go(0)},'secondary'));root.append(section)}
(async()=>{try{const d=await api({action:'config'});pages=d.pages;if(!pages.length)throw Error('الدرس غير متاح');if(location.hash==='#teacher')teacher();else go(0)}catch(e){root.replaceChildren(el('p','screen-message',e.message),button('إعادة المحاولة',()=>location.reload()))}})();
